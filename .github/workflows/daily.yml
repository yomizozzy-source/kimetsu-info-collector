name: 鬼滅の刃 朝チェック

on:
  schedule:
    # 毎朝 6:40 JST（= 21:40 UTC）に実行し、7時までに更新を終える。
    # GitHub の定期実行は混雑時に数分〜十数分遅れることがあるため少し早めにしています。
    - cron: "40 21 * * *"
  workflow_dispatch: # Actions タブから手動実行も可能

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Test
        run: python -m unittest discover -s tests

      - name: Collect
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m collector

      - name: Save state (既読管理)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update collected items $(TZ=Asia/Tokyo date '+%Y-%m-%d')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
